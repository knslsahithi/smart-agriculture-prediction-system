<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Change Password | Smart Agriculture</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body class="auth-page">


    <div class="auth-container">


        <!-- Logo -->

        <div class="auth-brand">
            🌱
        </div>


        <!-- Heading -->

        <h1>
            Change Password
        </h1>


        <p class="auth-subtitle">
            Update your account password securely.
        </p>


        <!-- Error -->

        {% if error %}

        <div class="error-message">

            {{ error }}

        </div>

        {% endif %}


        <!-- Success -->

        {% if success %}

        <div class="success-message">

            {{ success }}

        </div>

        {% endif %}


        <!-- Change Password Form -->

        <form
            action="{{ url_for('change_password') }}"
            method="POST"
            class="auth-form"
        >


            <!-- Current Password -->

            <div class="form-group">

                <label for="current_password">

                    Current Password

                </label>


                <input
                    type="password"
                    id="current_password"
                    name="current_password"
                    placeholder="Enter current password"
                    required
                >

            </div>


            <!-- New Password -->

            <div class="form-group">

                <label for="new_password">

                    New Password

                </label>


                <input
                    type="password"
                    id="new_password"
                    name="new_password"
                    placeholder="Enter new password"
                    required
                >

            </div>


            <!-- Confirm Password -->

            <div class="form-group">

                <label for="confirm_password">

                    Confirm New Password

                </label>


                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Re-enter new password"
                    required
                >

            </div>


            <!-- Button -->

            <button
                type="submit"
                class="auth-button"
            >

                Change Password

            </button>


        </form>


        <!-- Back to Dashboard -->

        <p class="auth-footer">

            <a href="{{ url_for('dashboard') }}">

                ← Back to Dashboard

            </a>

        </p>


        <!-- Logout -->

        <a
            href="{{ url_for('logout') }}"
            class="back-home"
        >

            Logout

        </a>


    </div>


</body>

</html>
